<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envelope</title>

<link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">

<style>
/* ===========================
   styles.css
=========================== */
/*   Mengatur tampilan dasar halaman */

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    overflow:hidden;

     background:
        radial-gradient(circle at top left,
            rgba(255,190,215,.28),
            transparent 100%),

        radial-gradient(circle at top right,
            rgba(255,190,215,.28),
            transparent 100%),

        radial-gradient(circle at bottom,
            rgba(255,210,225,.18),
            transparent 100%),

        #FFF8FB;

    overflow:hidden;
}

  /* ===========================
   Floating Hearts Background
=========================== */

#floating-hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

/* Love */

.bg-heart{
    position:absolute;

    bottom:-40px;

    color:#ff0000;

    opacity:.15;

    animation-name:floatLove;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
}

/* Animasi naik */

@keyframes floatLove{

    0%{
        transform:
            translateY(0)
            translateX(0)
            scale(.8);

        opacity:0;
    }

    10%{
        opacity:.18;
    }

    50%{
        transform:
            translateY(-50vh)
            translateX(20px)
            scale(1);
    }

    100%{

        transform:
            translateY(-120vh)
            translateX(-20px)
            scale(1.2);

        opacity:0;

    }

}


/* Badan utama amplop */
#envelope {
    position: relative;
    width: 280px;
    height: 180px;
    margin: 180px auto 0;
    background-color: #fba2ab;
    border-bottom-left-radius: 6px;
    border-bottom-right-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,.2);
    animation: float 3s ease-in-out infinite;
}
/* Wadah seluruh confetti */

#confetti-container{
    pointer-events:none;
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    overflow:visible;
    z-index:9999;
}
/* Confetti satuan */
.confetti{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    animation-name:fallConfetti;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
    opacity:.8;
}
/* Animasi confetti jatuh */

@keyframes fallConfetti{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(100vh) rotate(360deg);
        opacity:0;
    }
}
/* Animasi amplop mengambang */

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}
/* Bagian depan amplop */

.front{
    position:absolute;
    width:0;
    height:0;
    z-index:3;
}
/* Tutup amplop */
.flap{
    border-left:140px solid transparent;
    border-right:140px solid transparent;
    border-bottom:82px solid transparent;
    border-top:98px solid #fa95a0;
    transform-origin:top;
}
/* Kantong amplop */
.pocket{
    border-left:140px solid #fab3bb;
    border-right:140px solid #fab3bb;
    border-bottom:90px solid #fba2ab;
    border-top:90px solid transparent;
    border-bottom-left-radius:6px;
    border-bottom-right-radius:6px;
}
/*    Kertas surat */

.letter{
    position:relative;
    background:#fff;
    width:90%;
    height:90%;
    top:5%;
    margin:auto;
    border-radius:5px;
    padding-top:10px;
    box-shadow:0 2px 26px #fab3bb;
}
/* Overlay gradasi surat */
.letter:after{
    content:"";
    position:absolute;
    inset:0;
    background-image:linear-gradient(
        180deg,
        rgba(255,255,255,0) 25%,
        rgba(255,255,255,0) 55%,
        #fba2ab 100%
    );
}
/*    TEXT
   Tulisan di surat */

.words.line1,
.words.line2,
.words.line3,
.words.line4{
    display:block;
    font-family:"Edu NSW ACT Cursive", cursive;
    font-weight:600;
    font-size:20px;
    color:#f97a89;
    text-align:center;
    margin:5px 0;
}



/* ==========================
   WAX SEAL
========================== */

.seal-button{
    position:absolute;
    margin-top: -9%;

    left:50%;
    top:62%;

    transform:translate(-50%,-50%);

    width:50px;
    height:50px;

    border-radius:50%;

    background:#FFD8A7;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:120;

    border:3px solid rgba(255,255,255,.55);

    box-shadow:
        0 8px 18px rgba(0,0,0,.18),
        inset 0 3px 4px rgba(255,255,255,.45);

    transition:.25s;
}

/* Lingkaran kuning */

.seal-button::before{

    content:"";

    position:absolute;

    width:38px;
    height:38px;

    border-radius:50%;

    background:#FFE98E;

}

/* Badge hati */

.seal-heart{

    position:relative;

    width:20px;
    height:20px;

    border-radius:12px;

    background:#FF8DA1;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;

    font-weight:bold;

    border:1px solid white;

    z-index:2;

}

/* Hover */

.seal-button:hover{

    transform:
        translate(-50%,-50%)
        scale(1.08);

}

/* Saat ditekan */

.seal-button:active{

    transform:
        translate(-50%,-50%)
        scale(.94);

}

/* Saat surat terbuka */

.open .seal-button{

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.3);

    pointer-events:none;

}
/*  Animasi saat amplop dibuka */

.open .flap{
    transform:rotateX(180deg);
    transition:transform .4s ease,z-index .6s;
    z-index:1;
}

.close .flap{
    transform:rotateX(0);
    transition:transform .4s .6s ease,z-index 1s;
    z-index:5;
}
/*  Animasi saat amplop ditutup */
.close .letter{
    transform:translateY(0);
    transition:transform .4s ease,z-index 1s;
    z-index:1;
}

.open .letter{
    transform:translateY(-60px);
    transition:transform .4s .6s ease,z-index .6s;
    z-index:2;
}
/*  Tempat muncul hati */
.hearts{
    position:absolute;
    top:90px;
    left:0;
    right:0;
    z-index:2;
}
/* Bentuk hati */
.heart{
    position:absolute;
    bottom:0;
    right:10%;
}
/* Membentuk sisi kiri & kanan hati */
.heart:before,
.heart:after{
    position:absolute;
    content:"";
    left:20px;
    top:0;
    width:20px;
    height:40px;
    background:#f77685;
    border-radius:50px 50px 0 0;
    transform:rotate(-45deg);
    transform-origin:0 100%;
}
/* Menyembunyikan hati ketika amplop ditutup */
.heart:after{
    left:0;
    transform:rotate(45deg);
    transform-origin:100% 100%;
}

.close .heart{
    opacity:0;
    animation:none;
}
/* HEART ANIMATION 1
   Hati kecil */
.a1{
    left:20%;
    transform:scale(.6);
    opacity:1;
    animation:slideUp 4s linear 1,
              sideSway 2s ease-in-out 4 alternate;
    animation-fill-mode:forwards;
    animation-delay:.7s;
}
/* HEART ANIMATION 2
   Hati sedang */
.a2{
    left:55%;
    transform:scale(1);
    opacity:1;
    animation:slideUp 5s linear 1,
              sideSway 4s ease-in-out 2 alternate;
    animation-fill-mode:forwards;
    animation-delay:.7s;
}
/* HEART ANIMATION 3
   Hati besar */
.a3{
    left:10%;
    transform:scale(.8);
    opacity:1;
    animation:slideUp 7s linear 1,
              sideSway 2s ease-in-out 6 alternate;
    animation-fill-mode:forwards;
    animation-delay:.7s;
}
/* Animasi hati naik */
@keyframes slideUp{
    from{top:0;}
    to{top:-600px;}
}
/* Animasi hati bergoyang */
@keyframes sideSway{
    from{margin-left:0;}
    to{margin-left:50px;}
}
/*    WRAPPER
   Pembungkus amplop */
.envlope-wrapper{

    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;
}
.next-container{

    position:absolute;

    left:50%;
    top:590px;

    transform:
        translate(-50%,30px)
        scale(.85);

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    z-index:20;

    transition:
        opacity .4s ease,
        transform .45s cubic-bezier(.22,1,.36,1);

}

.next-container.show{

    opacity:1;

    visibility:visible;

    pointer-events:auto;

    transform:
        translate(-50%,0)
        scale(1);

}

/* ===========================
   HINT
   Petunjuk di bawah amplop
=========================== */

.hint{


    text-align:center;

    font-family:"Edu NSW ACT Cursive", cursive;
    font-size:17px;
    font-weight:600;

    color:#e67d91;

    letter-spacing:.0px;

    transition:
        opacity .35s ease,
        transform .35s ease,
        color .35s ease;
}
/* ===========================
   NEXT BUTTON
=========================== */


@keyframes floatNext{

    0%,100%{

        transform:
            translateX(-50%)
            translateY(0);

    }

    50%{

        transform:
            translateX(-50%)
            translateY(-5px);

    }

}


.next-container:hover{

    transform:scale(1.08);

    box-shadow:
        10 12px 24px rgba(0,0,0,.18);
}
.next-container:active{

    transform:
        translateX(-50%)
        scale(.95);

}

.next-kuromi{

    position:absolute;

    width:50px;

    left:60%;

    top:-78px;

    transform:translateX(-50%);

    z-index:10;
    animation:
        kuromiWave 2s ease-in-out infinite;
}
@keyframes kuromiWave{

    0%,100%{
        transform:rotate(0deg);
    }

    25%{
        transform:rotate(-5deg);
    }

    75%{
        transform:rotate(5deg);
    }

}
.next-btn{

    padding:8px 28px;

    border:none;

    border-radius:30px;

    background:#ff8da1;

    color:white;

    font-size:16px;

    cursor:pointer;

}
.next-btn:hover{

    box-shadow:
        0 0 15px rgba(255,140,170,.45),
        0 10px 20px rgba(0,0,0,.15);

}


</style>

</head>

<body>
<div id="floating-hearts"></div>
<div class="envlope-wrapper">
    <div id="envelope" class="close">

        <div class="front flap"></div>
        <div class="front pocket"></div>
<div class="seal-button" id="seal">

    <div class="seal-heart">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="white">
            <path d="M12 21s-7-4.35-9.33-8.13C.69 9.68 2.32 5.5 6.5 5.5c2.06 0 3.26 1.15 4 2.2.74-1.05 1.94-2.2 4-2.2 4.18 0 5.81 4.18 3.83 7.37C19 16.65 12 21 12 21z"/>
        </svg>

    </div>

</div>
        <div class="letter">

            <div class="words line1"></div>
            <div class="words line2"></div>
            <div class="words line3">Happy Birthday,Tata</div>
            <div class="words line4">with all my love</div>
        </div>

        <div class="hearts">
            <div class="heart a1"></div>
            <div class="heart a2"></div>
            <div class="heart a3"></div>
        </div>

    </div>
</div>


<div id="confetti-container"></div>

<p class="hint" id="hint">    Ketuk petutup untuk membuka surat... ✨</p>

<div id="nextContainer" class="next-container">
  <img src="image/kuromi.png" class="next-kuromi">
    <button id="nextBtn" class="next-btn">


        <span>Next ➜</span>

    </button>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<script>
// =========================
// script.js
// =========================

/* ===========================
   Floating Love Background
=========================== */

const bgContainer = document.getElementById("floating-hearts");

function createBackgroundHeart(){

    const heart = document.createElement("div");

    heart.className = "bg-heart";

    heart.innerHTML = "❤";

    // posisi acak
    heart.style.left = Math.random()*100+"vw";

    // ukuran acak
    const size = Math.random()*18 + 10;

    heart.style.fontSize = size+"px";

    // opacity acak
    heart.style.opacity = Math.random()*0.15 + 0.05;

    // durasi acak
    heart.style.animationDuration =
        (Math.random()*8 + 10)+"s";

    bgContainer.appendChild(heart);

    heart.addEventListener("animationend",()=>{

        heart.remove();

    });

}

// buat beberapa langsung
for(let i=0;i<25;i++){

    setTimeout(createBackgroundHeart,i*350);

}

// terus menerus
setInterval(createBackgroundHeart,700);

$(document).ready(function(){

    var envelope=$("#envelope");
    const hint = $("#hint");
    const seal=$("#seal");
    const nextContainer = $("#nextContainer");
    let isOpen=false;
    var heartInterval;

    envelope.click(function(){
        openEnvelope();
    });

    seal.on("click",function(){

    if(isOpen){

        closeEnvelope();

    }else{

        openEnvelope();

    }

    isOpen=!isOpen;

});

function openEnvelope(){

    envelope.addClass("open").removeClass("close");

    changeHint("Terbuka 💌, tekan tombol yang muncul...");

    createConfetti();

    heartInterval = setInterval(createHeart,1500);

    setTimeout(()=>{

        $("#nextContainer").addClass("show");

    },650);

}

function closeEnvelope(){

    envelope.addClass("close").removeClass("open");

    $("#nextContainer").removeClass("show");

    changeHint("Ketuk penutup untuk membuka surat... ✨");

    clearInterval(heartInterval);

    document.querySelector(".hearts").innerHTML = "";

}
        $("#nextBtn").click(function(){

        // nanti animasi menuju halaman buku

        });
    function changeHint(text){

        hint.css({
            opacity:0,
            transform:"translateY(6px)"
        });

        setTimeout(()=>{

            hint.text(text);

            hint.css({
                opacity:1,
                transform:"translateY(0)"
            });

        },250);

    }
    function createConfetti(){

        const container=document.getElementById("confetti-container");

        const colors=[
            "#ffe6f0",
            "#ffd6e0",
            "#ffc0cb",
            "#ffb6c1",
            "#ff9bb9"
        ];

        for(let i=0;i<250;i++){

            const confetti=document.createElement("div");

            confetti.classList.add("confetti");

            confetti.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];

            confetti.style.left=Math.random()*window.innerWidth+"px";

            confetti.style.top=(Math.random()*-150-50)+"px";

            confetti.style.animationDuration=(Math.random()+1)+"s";

            confetti.style.animationDelay=(Math.random()*0.5)+"s";

            confetti.style.transform=`rotate(${Math.random()*360}deg)`;

            container.appendChild(confetti);

            confetti.addEventListener("animationend",()=>{
                confetti.remove();
            });

        }

    }

    function createHeart(){

        const heartsContainer=document.querySelector(".hearts");

        const heart=document.createElement("div");

        heart.classList.add("heart");

        heart.style.left=(Math.random()*80+10)+"%";

        const classes=["a1","a2","a3"];

        heart.classList.add(classes[Math.floor(Math.random()*classes.length)]);

        heartsContainer.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },7000);

    }
    

});
</script>

</body>
</html>
